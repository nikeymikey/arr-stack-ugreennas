http:
  routers:
    # --- Public: Cloudflare proxied DNS -> port-forward -> Traefik :8443 ---
    tv1:
      rule: "Host(`tv1.nikeymikey.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: jellyfin

    arcade:
      rule: "Host(`arcade.nikeymikey.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: arcade

    # --- LAN only: web entrypoint (host :8080, never port-forwarded) ---
    sonarr:
      rule: "Host(`sonarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: sonarr

    radarr:
      rule: "Host(`radarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: radarr

    prowlarr:
      rule: "Host(`prowlarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: prowlarr

    jellyseerr:
      rule: "Host(`jellyseerr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: jellyseerr

    bazarr:
      rule: "Host(`bazarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: bazarr

    pihole:
      rule: "Host(`pihole.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: pihole

    wg:
      rule: "Host(`wg.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: wg

    uptime:
      rule: "Host(`uptime.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: uptime

  middlewares:
    # Requests via Cloudflare arrive from Cloudflare IPs and get a 403
    lan-only:
      ipAllowList:
        sourceRange:
          - "192.168.50.0/24"

  services:
    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.3:8989"

    radarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.3:7878"

    prowlarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.3:9696"

    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.50.139:8096"

    arcade:
      loadBalancer:
        servers:
          - url: "http://192.168.50.139:4235"

    jellyseerr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.8:5055"

    bazarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.9:6767"

    pihole:
      loadBalancer:
        servers:
          - url: "http://192.168.100.5:80"

    wg:
      loadBalancer:
        servers:
          - url: "http://192.168.100.6:51821"

    uptime:
      loadBalancer:
        servers:
          - url: "http://192.168.100.13:3001"
