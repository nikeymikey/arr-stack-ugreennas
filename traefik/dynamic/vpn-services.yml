http:
  routers:
    # --- Public: Cloudflare proxied DNS -> port-forward -> Traefik :8443 ---
    tv1:
      rule: "Host(`tv1.nikeymikey.com`)"
      entryPoints:
        - websecure
      middlewares:
        - cloudflare-only
      tls:
        certResolver: cloudflare
      service: jellyfin

    arcade:
      rule: "Host(`arcade.nikeymikey.com`)"
      entryPoints:
        - websecure
      middlewares:
        - cloudflare-only
      tls:
        certResolver: cloudflare
      service: arcade
      
    irc:
      rule: "Host(`irc.nikeymikey.com`)"
      entryPoints:
        - websecure
      middlewares:
        - cloudflare-only
      tls:
        certResolver: cloudflare
      service: thelounge  

    # --- LAN only: web entrypoint (host :8080, never port-forwarded) ---
    sonarr:
      rule: "Host(`sonarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: sonarr

    radarr:
      rule: "Host(`radarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: radarr

    prowlarr:
      rule: "Host(`prowlarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: prowlarr

    jellyseerr:
      rule: "Host(`requests.nikeymikey.com`)"
      entryPoints:
        - websecure
      middlewares:
        - cloudflare-only
      tls:
        certResolver: cloudflare
      service: jellyseerr

    bazarr:
      rule: "Host(`bazarr.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: bazarr

    pihole:
      rule: "Host(`pihole.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: pihole

    wg:
      rule: "Host(`wg.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: wg

    uptime:
      rule: "Host(`uptime.nikeymikey.com`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: uptime

  middlewares:
    # Requests via Cloudflare arrive from Cloudflare IPs and get a 403
    lan-only:
      ipAllowList:
        sourceRange:
          - "192.168.50.0/24"

    cloudflare-only:
      ipAllowList:
        sourceRange:
          - "173.245.48.0/20"
          - "103.21.244.0/22"
          - "103.22.200.0/22"
          - "103.31.4.0/22"
          - "141.101.64.0/18"
          - "108.162.192.0/18"
          - "190.93.240.0/20"
          - "188.114.96.0/20"
          - "197.234.240.0/22"
          - "198.41.128.0/17"
          - "162.158.0.0/15"
          - "104.16.0.0/13"
          - "104.24.0.0/14"
          - "172.64.0.0/13"
          - "131.0.72.0/22"
          - "2400:cb00::/32"
          - "2606:4700::/32"
          - "2803:f800::/32"
          - "2405:b500::/32"
          - "2405:8100::/32"
          - "2a06:98c0::/29"
          - "2c0f:f248::/32"
          - "192.168.50.0/24"

  services:
    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.3:8989"

    radarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.3:7878"

    prowlarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.3:9696"

    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.50.139:8096"

    arcade:
      loadBalancer:
        servers:
          - url: "http://192.168.50.139:4235"
          
    thelounge:
      loadBalancer:
        servers:
          - url: "http://192.168.50.139:9001"         
          
    jellyseerr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.8:5055"

    bazarr:
      loadBalancer:
        servers:
          - url: "http://192.168.100.9:6767"

    pihole:
      loadBalancer:
        servers:
          - url: "http://192.168.100.5:80"

    wg:
      loadBalancer:
        servers:
          - url: "http://192.168.100.6:51821"

    uptime:
      loadBalancer:
        servers:
          - url: "http://192.168.100.13:3001"
         
