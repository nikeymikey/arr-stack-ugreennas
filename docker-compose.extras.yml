name: arr-extras

# Extras: LAN-only apps, reached on 192.168.50.139:<port>. No Traefik routes yet.
# Always bring up by name: docker compose -f docker-compose.extras.yml up -d <service>
# Never combine this file with the other compose files.

networks:
  traefik-proxy:
    external: true
  profilarr-internal:
    internal: true
  tracearr-internal:
    internal: true

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  #############################################
  # Quality profiles / custom formats (Profilarr v2)
  # Old v1 data in /volume2/docker/profilarr/data is incompatible and unused.
  #############################################
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.3.1
    container_name: profilarr
    ports:
      - "192.168.50.139:6868:6868"
    environment:
      - PUID=1000
      - PGID=10
      - TZ=Europe/London
      # 2.3.1 accepts a single origin only
      - ORIGIN=http://192.168.50.139:6868
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
    volumes:
      - /volume2/docker/profilarr/config:/config
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.11
      profilarr-internal:
    depends_on:
      profilarr-parser:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.3.1
    container_name: profilarr-parser
    networks:
      - profilarr-internal
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Playback monitoring (Tracearr) + TimescaleDB + Redis
  # Polls Jellyfin-HT directly at 192.168.50.139:8096 (no SSE plugin, no Traefik).
  #############################################
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:3.1.3
    container_name: tracearr
    user: "1000:10"
    ports:
      - "192.168.50.139:3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - TZ=Europe/London
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD:?set in .env}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET:?set in .env}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET:?set in .env}
    volumes:
      - /volume2/docker/tracearr/backup:/data/backup
      - /volume2/docker/tracearr/image-cache:/data/tracearr/image-cache
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.12
      tracearr-internal:
    depends_on:
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  tracearr-db:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1
    container_name: tracearr-db
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - postgres
      - -c
      - timescaledb.license=timescale
      - -c
      - timescaledb.max_tuples_decompressed_per_dml_transaction=100000
      - -c
      - max_locks_per_transaction=4096
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - max_connections=150
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_DB=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD:?set in .env}
      - TZ=Europe/London
    volumes:
      - /volume2/docker/tracearr/pgdata:/home/postgres/pgdata/data
    networks:
      - tracearr-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  tracearr-redis:
    image: redis:8.2-alpine
    container_name: tracearr-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - /volume2/docker/tracearr/redis:/data
    networks:
      - tracearr-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Year-in-review stats (Rewindarr), Jellyfin data via Tracearr
  # Starts as root, then drops to PUID:PGID via su-exec (entrypoint).
  #############################################
  rewindarr:
    image: ghcr.io/raunot/rewindarr:5.6.0
    container_name: rewindarr
    ports:
      - "192.168.50.139:8383:8383"
    environment:
      - NEXTAUTH_SECRET=${REWINDARR_NEXTAUTH_SECRET:?set in .env}
      - NEXTAUTH_URL=http://192.168.50.139:8383
      - NEXT_PUBLIC_SITE_URL=http://192.168.50.139:8383
      - TZ=Europe/London
      - PUID=1000
      - PGID=10
    volumes:
      - /volume2/docker/rewindarr/config:/app/config
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.14
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Media cleanup rules (Maintainerr). NO built-in login: localhost only,
  # reach the UI with: ssh -L 6246:127.0.0.1:6246 nas
  # Dry-run policy: every rule group "Do nothing", an *arr selected, no media mount.
  #############################################
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.31.0
    container_name: maintainerr
    user: "1000:10"
    ports:
      - "127.0.0.1:6246:6246"
    environment:
      - TZ=Europe/London
    volumes:
      - /volume2/docker/maintainerr/data:/opt/data
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.15
    restart: unless-stopped
    logging: *default-logging
