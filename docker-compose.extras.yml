name: arr-extras

# Extras: LAN-only apps, reached on 192.168.50.139:<port>. No Traefik routes yet.
# Always bring up by name: docker compose -f docker-compose.extras.yml up -d <service>
# Never combine this file with the other compose files.

networks:
  traefik-proxy:
    external: true
  profilarr-internal:
    internal: true
  tracearr-internal:
    internal: true

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  #############################################
  # Quality profiles / custom formats (Profilarr v2)
  # Old v1 data in /volume2/docker/profilarr/data is incompatible and unused.
  #############################################
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.3.1
    container_name: profilarr
    ports:
      - "192.168.50.139:6868:6868"
    environment:
      - PUID=1000
      - PGID=10
      - TZ=Europe/London
      # 2.3.1 accepts a single origin only
      - ORIGIN=http://192.168.50.139:6868
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
    volumes:
      - /volume2/docker/profilarr/config:/config
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.11
      profilarr-internal:
    depends_on:
      profilarr-parser:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.3.1
    container_name: profilarr-parser
    networks:
      - profilarr-internal
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Playback monitoring (Tracearr) + TimescaleDB + Redis
  # Polls Jellyfin-HT directly at 192.168.50.139:8096 (no SSE plugin, no Traefik).
  #############################################
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:3.1.5
    container_name: tracearr
    user: "1000:10"
    ports:
      - "192.168.50.139:3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - TZ=Europe/London
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD:?set in .env}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET:?set in .env}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET:?set in .env}
    volumes:
      - /volume2/docker/tracearr/backup:/data/backup
      - /volume2/docker/tracearr/image-cache:/data/tracearr/image-cache
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.12
      tracearr-internal:
    depends_on:
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  tracearr-db:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1
    container_name: tracearr-db
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - postgres
      - -c
      - timescaledb.license=timescale
      - -c
      - timescaledb.max_tuples_decompressed_per_dml_transaction=100000
      - -c
      - max_locks_per_transaction=4096
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - max_connections=150
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_DB=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD:?set in .env}
      - TZ=Europe/London
    volumes:
      - /volume2/docker/tracearr/pgdata:/home/postgres/pgdata/data
    networks:
      - tracearr-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  tracearr-redis:
    image: redis:8.2-alpine
    container_name: tracearr-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - /volume2/docker/tracearr/redis:/data
    networks:
      - tracearr-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Year-in-review stats (Rewindarr), Jellyfin data via Tracearr
  # Starts as root, then drops to PUID:PGID via su-exec (entrypoint).
  #############################################
  rewindarr:
    image: ghcr.io/raunot/rewindarr:5.6.0
    container_name: rewindarr
    ports:
      - "192.168.50.139:8383:8383"
    environment:
      - NEXTAUTH_SECRET=${REWINDARR_NEXTAUTH_SECRET:?set in .env}
      - NEXTAUTH_URL=http://192.168.50.139:8383
      - NEXT_PUBLIC_SITE_URL=http://192.168.50.139:8383
      - TZ=Europe/London
      - PUID=1000
      - PGID=10
    volumes:
      - /volume2/docker/rewindarr/config:/app/config
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.14
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Media cleanup rules (Maintainerr). NO built-in login: LAN only on
  # 192.168.50.139:6246 by the owner's choice. Never route or forward it.
  # Dry-run policy: every rule group "Do nothing", an *arr selected, no media mount.
  #############################################
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.31.0
    container_name: maintainerr
    user: "1000:10"
    ports:
      - "192.168.50.139:6246:6246"
    environment:
      - TZ=Europe/London
    volumes:
      - /volume2/docker/maintainerr/data:/opt/data
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.15
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Transcode automation (Tdarr). Internal node starts UNPAUSED so it survives the
  # 03:00 backup restart; its node schedule (set in the UI) is the guard.
  # No login (auth off): localhost only, UI via ssh -L 8265:127.0.0.1:8265 nas
  #############################################
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.96.01
    container_name: tdarr
    ports:
      - "127.0.0.1:8265:8265"
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=10
      - UMASK=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - auth=false
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=nas-internal
      - startPaused=false
      - transcodecpuWorkers=0
      - transcodegpuWorkers=0
      - healthcheckcpuWorkers=0
      - healthcheckgpuWorkers=0
      - maxLogSizeMB=10
      - cronPluginUpdate=
    volumes:
      - /volume2/docker/tdarr/server:/app/server
      - /volume2/docker/tdarr/configs:/app/configs
      - /volume2/docker/tdarr/logs:/app/logs
      - /volume2/docker/tdarr/temp:/temp
      - /volume1/media:/media1
      - /volume3/media2:/media2
      # Write-enabled: the two private libraries only (HEVC/QSV, test phase).
      # Never point a library at these until the test results are approved.
      - /volume1/media-private:/media-private
      - /volume1/media-private-v3:/media-private-v3
      # Shared with the PC node over SMB (UGOS share "tdarr-work", no recycle bin).
      - /volume2/tdarr-work/cache:/tdarr-cache
      - /volume2/tdarr-work/test:/tdarr-test
    # Quick Sync (Pentium Gold 8505 UHD iGPU), shared with Jellyfin-HT: one worker, off-peak.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "105"
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.16
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Adult library (Whisparr v2, Sonarr-based). Has its own login (Forms, Enabled):
  # LAN address only. Not managed by Profilarr (no Whisparr support in 2.3.1).
  # hotio s6 image: fails under user:, so it starts as root and drops to PUID:PGID.
  # Usenet: SABnzbd category "whisparr" -> Syncthing folder data1/whisparr.
  # Torrents: label "whisparr", land in the shared sync folder, imported by hand.
  #############################################
  whisparr:
    image: ghcr.io/hotio/whisparr:v2-2.2.0-release.231
    container_name: whisparr
    ports:
      - "192.168.50.139:6969:6969"
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=10
      - UMASK=002
    volumes:
      - /volume2/docker/whisparr/config:/config
      - /volume2/docker/syncthing/data1/whisparr:/downloads
      - /volume1/media-private:/media-private
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.17
    restart: unless-stopped
    logging: *default-logging

  #############################################
  # Adult library (Whisparr v3 "Eros"), alongside v2. Local only: no Traefik router,
  # no Cloudflare record, no router forward. Never publish it.
  # LAN only on 192.168.50.139:6970 (Forms login). Not managed by Profilarr.
  # hotio s6 image: fails under user:, so it starts as root and drops to PUID:PGID.
  # Usenet: SABnzbd category "whisparr3" -> Syncthing folder data1/whisparr3.
  # Torrents: label "whisparr3", seedbox /sda/0006/downloads/whisparr3.
  #############################################
  whisparr3:
    image: ghcr.io/hotio/whisparr:v3-3.6.5-release.1886
    container_name: whisparr3
    ports:
      - "192.168.50.139:6970:6969"
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=10
      - UMASK=002
    volumes:
      - /volume2/docker/whisparr3/config:/config
      - /volume2/docker/syncthing/data1/whisparr3:/downloads
      - /volume1/media-private-v3:/media-private-v3
    networks:
      traefik-proxy:
        ipv4_address: 192.168.100.18
    restart: unless-stopped
    logging: *default-logging
